[project]
name = "spectrecon"
version = "0.1.0"
description = "RF licensing intelligence: entity, site, and frequency pivots over FCC ULS public data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
    "folium>=0.15",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
spectrecon = "spectrecon.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
