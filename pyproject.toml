[project]
name = "spectrecon"
version = "0.1.0"
description = "RF licensing intelligence: entity, site, and frequency pivots over FCC ULS public data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
    "folium>=0.15",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "mcp>=1.12,<2",
    "cryptography>=43,<46",
]

[project.scripts]
spectrecon = "spectrecon.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
serial = ["pyserial>=3.5"]

[dependency-groups]
dev = ["pytest>=8"]
